# Default stack: Strapi (SQLite) + React — no Postgres (smaller disk use).
# For Postgres: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build

services:
  strapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-strapi
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: .tmp/data.db
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-change-this}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-your-admin-jwt-secret-change-this}
      APP_KEYS: ${APP_KEYS:-your-app-keys-change-this}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-your-api-token-salt-change-this}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-your-transfer-token-salt-change-this}
    volumes:
      - ./backend:/opt/app
      - strapi_data:/opt/app/.tmp
    command: sh -c "npm install && npm run develop"
    ports:
      - "1337:1337"
    networks:
      - portfolio-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:1337/',()=>process.exit(0)).on('error',()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: portfolio-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    environment:
      REACT_APP_STRAPI_URL: http://localhost:1337
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WDS_SOCKET_PORT: "0"
      HOST: "0.0.0.0"
    networks:
      - portfolio-network
    depends_on:
      strapi:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  strapi_data:

networks:
  portfolio-network:
    driver: bridge
