<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var k = 'portfolio-theme';
          var t = localStorage.getItem(k);
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
          else
            document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: light)')
              .matches
              ? 'light'
              : 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070a10" />
    <meta
      name="description"
      content="Mahmudul Islam — full-stack software engineer. TypeScript, Python, React, cloud, and LLM systems."
    />
    <title>Mahmudul Islam — Software Engineer</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
