# Run from frontend/: writes ./build on the host via Docker (no local Node required).
#   npm run build
# Or: docker compose -f docker-compose.build.yml run --rm frontend-build

services:
  frontend-build:
    build:
      context: .
      dockerfile: Dockerfile
      target: source
    environment:
      CI: "true"
      REACT_APP_STRAPI_URL: ${REACT_APP_STRAPI_URL:-http://localhost:1337}
    volumes:
      - ./build:/app/build
    command: ["sh", "-c", "npx react-scripts build"]
